<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Balance & Training Simulator</title>
    <style>
      body {
        background-color: #0f172a; /* Slate 900 */
        color: #f8fafc;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        margin: 0;
        padding: 20px;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .header {
        text-align: center;
        margin-bottom: 20px;
      }
      .header h1 {
        margin: 0 0 10px 0;
        color: #38bdf8;
      }
      .dashboard {
        display: flex;
        gap: 20px;
        margin-bottom: 20px;
        background: #1e293b;
        padding: 15px 30px;
        border-radius: 10px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
      }
      .stat-box {
        text-align: center;
      }
      .stat-value {
        font-size: 24px;
        font-weight: bold;
        color: #10b981; /* Emerald 500 */
      }
      .stat-label {
        font-size: 12px;
        color: #94a3b8;
        text-transform: uppercase;
        letter-spacing: 1px;
      }
      .controls {
        display: flex;
        gap: 10px;
        margin-bottom: 20px;
      }
      button {
        background: #3b82f6;
        color: white;
        border: none;
        padding: 8px 16px;
        border-radius: 6px;
        cursor: pointer;
        font-weight: bold;
        transition: background 0.2s;
      }
      button:hover {
        background: #2563eb;
      }
      button.active {
        background: #10b981;
      }
      canvas {
        background-color: #1e293b;
        border: 2px solid #334155;
        border-radius: 8px;
        box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
      }
      .legend {
        margin-top: 15px;
        display: flex;
        gap: 15px;
        font-size: 14px;
      }
      .legend-item {
        display: flex;
        align-items: center;
        gap: 5px;
      }
      .dot {
        width: 12px;
        height: 12px;
        border-radius: 50%;
      }
      .dot.agent {
        background: #38bdf8;
      }
      .dot.enemy {
        background: #ef4444;
      }
      .dot.buff {
        background: #10b981;
      }
    </style>
  </head>
  <body>
    <div class="header">
      <h1>🧠 AI Playtesting Simulator</h1>
      <p>Watch neural network agents learn to survive, dash, and collect buffs.</p>
    </div>

    <div class="dashboard">
      <div class="stat-box">
        <div id="gen-value" class="stat-value">1</div>
        <div class="stat-label">Generation</div>
      </div>
      <div class="stat-box">
        <div id="alive-value" class="stat-value">50/50</div>
        <div class="stat-label">Alive Agents</div>
      </div>
      <div class="stat-box">
        <div id="fitness-value" class="stat-value">0.0</div>
        <div class="stat-label">Best Fitness</div>
      </div>
      <div class="stat-box">
        <div id="time-value" class="stat-value" style="color: #eab308">30s</div>
        <div class="stat-label">Time Left</div>
      </div>
    </div>

    <div class="controls">
      <button id="btn-speed-1" class="active">Normal Speed (1x)</button>
      <button id="btn-speed-5">Fast Forward (5x)</button>
      <button id="btn-speed-max">Ultra Training (No Render)</button>
    </div>

    <canvas id="gameCanvas" width="800" height="600"></canvas>

    <div class="legend">
      <div class="legend-item">
        <div class="dot agent"></div>
        AI Agents (Blue = Healthy, Purple = Dashing)
      </div>
      <div class="legend-item">
        <div class="dot enemy"></div>
        Enemies
      </div>
      <div class="legend-item">
        <div class="dot buff"></div>
        HP Buffs
      </div>
    </div>

    <script type="module" src="/scripts/visual-rl.ts"></script>
  </body>
</html>
