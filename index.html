    <div id="root"></div>

    <!-- Vite Chunk Loading Error Handler (Root Fix) -->
    <script>
      window.addEventListener('vite:preloadError', event => {
        const isReloading = sessionStorage.getItem('vite-chunk-reload');
        if (!isReloading) {
          sessionStorage.setItem('vite-chunk-reload', 'true');
          window.location.reload();
        } else {
          console.error('[App] Failed to load chunks even after reloading.');
        }
      });
      window.addEventListener('load', () => {
        sessionStorage.removeItem('vite-chunk-reload');
      });
    </script>

    <script type="module" src="/index.tsx"></script>

    <!-- Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        // Option to disable SW for E2E testing
        const swDisabled =
          localStorage.getItem('disable_sw') === 'true' ||
          window.location.search.includes('no-sw=true');

        if (!swDisabled) {
          window.addEventListener('load', () => {
            navigator.serviceWorker
              .register('/sw.js')
              .then(registration => {
                console.log('[App] Service Worker registered:', registration.scope);

                // Check for updates
                registration.addEventListener('updatefound', () => {
                  const newWorker = registration.installing;
                  if (newWorker) {
                    newWorker.addEventListener('statechange', () => {
                      if (
                        newWorker.state === 'installed' &&
                        navigator.serviceWorker.controller
                      ) {
                        // New version available
                        console.log('[App] New version available!');
                        // You could show a toast here: "New version available, refresh to update"
                      }
                    });
                  }
                });
              })
              .catch(error => {
                console.warn('[App] Service Worker registration failed:', error);
              });
          });
        } else {
          // If SW is disabled but exists, unregister it
          navigator.serviceWorker.getRegistrations().then(registrations => {
            for (const registration of registrations) {
              registration.unregister();
              console.log('[App] Service Worker unregistered');
            }
          });
        }
      }
    </script>
